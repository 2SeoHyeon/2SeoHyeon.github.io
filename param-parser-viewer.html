<title>파라미터 파서 뷰어</title>
<style>
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-alt: #eef1f5;
    --border: #d8dee6;
    --text: #171b23;
    --text-dim: #5b6472;
    --accent: #3660f4;
    --accent-contrast: #ffffff;
    --accent-soft: #e8edff;
    --success: #16a34a;
    --success-soft: #e7f8ee;
    --error: #dc2626;
    --error-soft: #fdeceb;
    --num: #b5560d;
    --bool: #7c3aed;
    --font-sans: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", ui-sans-serif, system-ui, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", "D2Coding", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a;
      --surface: #171b24;
      --surface-alt: #1e2330;
      --border: #2b3140;
      --text: #e7eaf0;
      --text-dim: #8a93a6;
      --accent: #6d8bff;
      --accent-contrast: #0b1020;
      --accent-soft: #1c2540;
      --success: #4ade80;
      --success-soft: #123321;
      --error: #f87171;
      --error-soft: #3a1616;
      --num: #f0a35e;
      --bool: #b794f6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a;
    --surface: #171b24;
    --surface-alt: #1e2330;
    --border: #2b3140;
    --text: #e7eaf0;
    --text-dim: #8a93a6;
    --accent: #6d8bff;
    --accent-contrast: #0b1020;
    --accent-soft: #1c2540;
    --success: #4ade80;
    --success-soft: #123321;
    --error: #f87171;
    --error-soft: #3a1616;
    --num: #f0a35e;
    --bool: #b794f6;
  }
  :root[data-theme="light"] {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-alt: #eef1f5;
    --border: #d8dee6;
    --text: #171b23;
    --text-dim: #5b6472;
    --accent: #3660f4;
    --accent-contrast: #ffffff;
    --accent-soft: #e8edff;
    --success: #16a34a;
    --success-soft: #e7f8ee;
    --error: #dc2626;
    --error-soft: #fdeceb;
    --num: #b5560d;
    --bool: #7c3aed;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
  }

  .app {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 2px 0 0;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    text-transform: none;
    letter-spacing: 0;
  }

  .badge.err {
    background: var(--error-soft);
    color: var(--error);
  }

  /* segmented control */
  .segmented {
    display: inline-flex;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }

  .segmented button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .segmented button:hover { color: var(--text); }

  .segmented button.active {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .segmented button:focus-visible,
  button:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* input bay */
  .input-bay {
    padding: 14px;
    gap: 10px;
  }

  .input-bay .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .field-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
  }

  textarea {
    width: 100%;
    resize: vertical;
    min-height: 110px;
    background: var(--surface-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.55;
  }

  .examples {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .examples button {
    appearance: none;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  .examples button:hover { color: var(--text); border-color: var(--accent); }

  .error-line {
    display: none;
    align-items: center;
    gap: 6px;
    color: var(--error);
    font-size: 12.5px;
    font-family: var(--font-mono);
  }
  .error-line.show { display: flex; }
  .error-line.warn { color: var(--num); }

  /* output grid */
  .output-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    flex: 1;
    min-height: 480px;
  }

  @media (max-width: 880px) {
    .output-grid { grid-template-columns: 1fr; min-height: unset; }
    .output-grid > .card { min-height: 420px; }
  }

  .copy-btn {
    appearance: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .copy-btn.copied { color: var(--success); border-color: var(--success); background: var(--success-soft); }

  pre.output {
    margin: 0;
    padding: 14px;
    overflow: auto;
    flex: 1;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
  }

  pre.output:empty::before,
  pre.output.placeholder::before {
    content: attr(data-placeholder);
    color: var(--text-dim);
    white-space: normal;
  }

  .tree {
    flex: 1;
    overflow: auto;
    padding: 10px 14px 14px;
    font-family: var(--font-mono);
    font-size: 12.5px;
  }

  .tree-node { margin: 0; padding: 0; }

  .tree summary {
    cursor: pointer;
    list-style: none;
    padding: 3px 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .tree summary::-webkit-details-marker { display: none; }

  .tree summary::before {
    content: "▸";
    display: inline-block;
    width: 12px;
    color: var(--text-dim);
    transition: transform 0.12s;
    flex-shrink: 0;
  }
  .tree details[open] > summary::before { transform: rotate(90deg); }

  .tree-children {
    margin-left: 15px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }

  .tree-leaf {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 0 3px 18px;
  }

  .tree-key { color: var(--accent); font-weight: 600; }
  .tree-colon { color: var(--text-dim); }
  .tree-meta { color: var(--text-dim); font-size: 11px; font-weight: 400; }
  .tree-value.tree-string { color: var(--text); }
  .tree-value.tree-number { color: var(--num); }
  .tree-value.tree-bool { color: var(--bool); }
  .tree-value.tree-null { color: var(--text-dim); font-style: italic; }
  .tree-value.tree-empty { color: var(--text-dim); font-style: italic; }

  .empty-hint {
    color: var(--text-dim);
    padding: 14px;
    font-size: 12.5px;
  }
</style>

<div class="app">
  <header>
    <div>
      <h1>파라미터 파서 뷰어</h1>
      <p>querystring · json · xml 상호 변환 및 구조 확인 도구</p>
    </div>
  </header>

  <section class="card input-bay">
    <div class="row">
      <span class="field-label">입력 데이터</span>
      <div class="row" style="gap:16px;">
        <div class="row" style="gap:6px;">
          <span class="field-label" style="font-weight:500;">입력 형식</span>
          <div class="segmented" id="inputFormatSeg">
            <button data-val="auto" class="active">자동감지</button>
            <button data-val="querystring">Query</button>
            <button data-val="json">JSON</button>
            <button data-val="xml">XML</button>
          </div>
        </div>
        <span class="badge" id="detectedBadge">감지: -</span>
      </div>
    </div>

    <textarea id="inputText" spellcheck="false" placeholder="예) a=1&amp;b=2&amp;&amp;  또는  {&quot;a&quot;:1,&quot;b&quot;:2}  또는  &lt;root&gt;&lt;a&gt;1&lt;/a&gt;&lt;/root&gt;"></textarea>

    <div class="row">
      <div class="examples">
        <button data-ex="qs">쿼리스트링 예제</button>
        <button data-ex="json">JSON 예제</button>
        <button data-ex="xml">XML 예제</button>
        <button data-ex="clear">지우기</button>
      </div>
      <div class="row" style="gap:6px;">
        <span class="field-label" style="font-weight:500;">출력 형식</span>
        <div class="segmented" id="outputFormatSeg">
          <button data-val="querystring">Query</button>
          <button data-val="json" class="active">JSON</button>
          <button data-val="xml">XML</button>
        </div>
      </div>
    </div>

    <div class="error-line" id="errorLine">⚠ <span id="errorText"></span></div>
  </section>

  <section class="output-grid">
    <div class="card" id="prettyCard">
      <div class="card-head">
        <span class="card-title">포맷팅 결과 <span class="badge" id="outFormatBadge">JSON</span></span>
        <button class="copy-btn" data-copy="pretty">복사</button>
      </div>
      <pre class="output" id="prettyOutput" data-placeholder="정형화된(pretty) 결과가 여기에 표시됩니다."></pre>
    </div>

    <div class="card" id="treeCard">
      <div class="card-head">
        <span class="card-title">트리 구조</span>
      </div>
      <div class="tree" id="treeOutput"></div>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var inputText = document.getElementById("inputText");
  var detectedBadge = document.getElementById("detectedBadge");
  var errorLine = document.getElementById("errorLine");
  var errorText = document.getElementById("errorText");
  var prettyOutput = document.getElementById("prettyOutput");
  var treeOutput = document.getElementById("treeOutput");
  var outFormatBadge = document.getElementById("outFormatBadge");

  var state = {
    inputMode: "auto",   // auto | querystring | json | xml
    outputFormat: "json", // querystring | json | xml
    lastModel: null,
    lastRootTag: "root"
  };

  var FORMAT_LABEL = { querystring: "QUERY", json: "JSON", xml: "XML" };

  // ---------- parsing ----------

  function detectFormat(text) {
    var t = text.trim();
    if (t.charAt(0) === "<") return "xml";
    if (t.charAt(0) === "{" || t.charAt(0) === "[") return "json";
    return "querystring";
  }

  function addKV(obj, key, value) {
    if (Object.prototype.hasOwnProperty.call(obj, key)) {
      if (Array.isArray(obj[key])) obj[key].push(value);
      else obj[key] = [obj[key], value];
    } else {
      obj[key] = value;
    }
  }

  function parseQueryString(text) {
    var warnings = [];
    function addWarning(msg) { if (warnings.indexOf(msg) === -1) warnings.push(msg); }

    var t = text;
    if (t.charAt(0) === "?") { t = t.slice(1); addWarning("맨 앞의 '?' 문자를 제거했습니다."); }

    var segments = t.split("&").map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
    var obj = {};
    segments.forEach(function (seg) {
      var eqIdx = seg.indexOf("=");
      var key, value;
      if (eqIdx === -1) { key = seg; value = ""; }
      else { key = seg.slice(0, eqIdx); value = seg.slice(eqIdx + 1); }
      try { key = decodeURIComponent(key); } catch (e) { addWarning("키를 디코딩할 수 없어 원본 텍스트를 사용했습니다."); }
      try { value = decodeURIComponent(value); } catch (e) { addWarning("값을 디코딩할 수 없어 원본 텍스트를 사용했습니다."); }
      addKV(obj, key, value);
    });
    if (segments.length === 0) addWarning("유효한 key=value 쌍을 찾지 못해 빈 객체로 처리했습니다.");
    return { obj: obj, warnings: warnings };
  }

  function xmlNodeToObj(node) {
    var attrs = {};
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i];
      attrs["@" + a.name] = a.value;
    }
    var childEls = Array.prototype.filter.call(node.childNodes, function (n) { return n.nodeType === 1; });

    if (childEls.length === 0) {
      var text = node.textContent == null ? "" : node.textContent.trim();
      if (Object.keys(attrs).length === 0) return text;
      var leaf = {};
      Object.keys(attrs).forEach(function (k) { leaf[k] = attrs[k]; });
      if (text !== "") leaf["#text"] = text;
      return leaf;
    }

    var result = {};
    Object.keys(attrs).forEach(function (k) { result[k] = attrs[k]; });
    childEls.forEach(function (child) {
      var tag = child.tagName;
      var val = xmlNodeToObj(child);
      addKV(result, tag, val);
    });
    return result;
  }

  function parseXml(text) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(text, "application/xml");
    var perr = doc.getElementsByTagName("parsererror");
    if (perr.length > 0) throw new Error("XML 구문이 올바르지 않습니다.");
    var root = doc.documentElement;
    if (!root) throw new Error("XML 루트 요소를 찾을 수 없습니다.");
    return { rootTag: root.tagName, data: xmlNodeToObj(root) };
  }

  // ---------- lenient XML repair ----------
  // Recovers a best-effort element tree even when closing/opening tags are
  // missing, mismatched, or the document has no single root element.

  function lenientXmlParse(text) {
    var warnings = [];
    function addWarning(msg) { if (warnings.indexOf(msg) === -1) warnings.push(msg); }

    var src = text
      .replace(/<!--[\s\S]*?-->/g, "")
      .replace(/<\?[\s\S]*?\?>/g, "")
      .replace(/<!DOCTYPE[\s\S]*?>/gi, "");

    function parseAttrs(attrStr) {
      var attrs = {};
      var re = /([a-zA-Z_][\w:.\-]*)\s*=\s*("([^"]*)"|'([^']*)')/g;
      var m;
      while ((m = re.exec(attrStr))) {
        attrs[m[1]] = m[3] !== undefined ? m[3] : m[4];
      }
      return attrs;
    }

    function finalizeNode(node) {
      return { tag: node.tag, attrs: node.attrs, children: node.children, text: node.textParts.join("").trim() };
    }

    var stack = [];
    var topLevel = [];

    function closeElement(node) {
      if (stack.length > 0) stack[stack.length - 1].children.push(node);
      else topLevel.push(node);
    }
    function appendText(str) {
      if (str && stack.length > 0) stack[stack.length - 1].textParts.push(str);
    }

    var tagRe = /<(\/?)\s*([a-zA-Z_][\w:.\-]*)([^<>]*)>/g;
    var lastIndex = 0;
    var match;
    while ((match = tagRe.exec(src)) !== null) {
      appendText(src.slice(lastIndex, match.index));
      lastIndex = tagRe.lastIndex;

      var isClosing = match[1] === "/";
      var tagName = match[2];
      var raw = match[3] || "";
      var selfClosing = /\/\s*$/.test(raw);
      var attrStr = selfClosing ? raw.replace(/\/\s*$/, "") : raw;

      if (isClosing) {
        var idx = -1;
        for (var s = stack.length - 1; s >= 0; s--) {
          if (stack[s].tag === tagName) { idx = s; break; }
        }
        if (idx === -1) {
          addWarning("여는 태그가 없는 </" + tagName + ">를 무시했습니다.");
        } else {
          while (stack.length - 1 > idx) {
            var unclosed = stack.pop();
            addWarning("</" + unclosed.tag + "> 태그가 없어 자동으로 닫았습니다.");
            closeElement(finalizeNode(unclosed));
          }
          closeElement(finalizeNode(stack.pop()));
        }
      } else {
        if (!selfClosing && stack.length > 0 && stack[stack.length - 1].tag === tagName) {
          var reopened = stack.pop();
          addWarning("<" + tagName + ">가 반복되어 이전 태그를 자동으로 닫았습니다.");
          closeElement(finalizeNode(reopened));
        }
        var node = { tag: tagName, attrs: parseAttrs(attrStr), children: [], textParts: [] };
        if (selfClosing) closeElement(finalizeNode(node));
        else stack.push(node);
      }
    }
    appendText(src.slice(lastIndex));

    while (stack.length > 0) {
      var remaining = stack.pop();
      addWarning("</" + remaining.tag + "> 태그가 없어 자동으로 닫았습니다.");
      closeElement(finalizeNode(remaining));
    }

    if (topLevel.length === 0) {
      throw new Error("XML 요소를 찾을 수 없습니다.");
    }

    function nodeToObj(node) {
      var attrs = {};
      Object.keys(node.attrs).forEach(function (k) { attrs["@" + k] = node.attrs[k]; });
      if (node.children.length === 0) {
        var text = node.text || "";
        if (Object.keys(attrs).length === 0) return text;
        var leaf = {};
        Object.keys(attrs).forEach(function (k) { leaf[k] = attrs[k]; });
        if (text !== "") leaf["#text"] = text;
        return leaf;
      }
      var result = {};
      Object.keys(attrs).forEach(function (k) { result[k] = attrs[k]; });
      node.children.forEach(function (child) { addKV(result, child.tag, nodeToObj(child)); });
      return result;
    }

    if (topLevel.length === 1) {
      return { rootTag: topLevel[0].tag, data: nodeToObj(topLevel[0]), warnings: warnings };
    }

    addWarning("여러 개의 최상위 요소를 <root>로 묶었습니다.");
    var rootObj = {};
    topLevel.forEach(function (node) { addKV(rootObj, node.tag, nodeToObj(node)); });
    return { rootTag: "root", data: rootObj, warnings: warnings };
  }

  // ---------- lenient JSON repair ----------
  // Recovers a best-effort structure from JSON with common typos (missing
  // quotes around keys/values, missing colons, missing/extra commas, single
  // quotes, unbalanced closing brackets) instead of failing outright.

  function unescapeJsonString(raw) {
    try { return JSON.parse('"' + raw + '"'); } catch (e) { return raw; }
  }

  function lenientJsonParse(text) {
    var i = 0;
    var len = text.length;
    var warnings = [];

    function addWarning(msg) {
      if (warnings.indexOf(msg) === -1) warnings.push(msg);
    }
    function skipWs() {
      while (i < len && /\s/.test(text.charAt(i))) i++;
    }
    function peek() { return i < len ? text.charAt(i) : ""; }

    function readQuotedString(quoteChar) {
      i++; // skip opening quote
      var out = "";
      while (i < len) {
        var ch = text.charAt(i);
        if (ch === "\\" && i + 1 < len) { out += ch + text.charAt(i + 1); i += 2; continue; }
        if (ch === quoteChar) { i++; return out; }
        out += ch;
        i++;
      }
      addWarning("닫히지 않은 문자열을 자동으로 닫았습니다.");
      return out;
    }

    function readLenientToken(context) {
      skipWs();
      var ch = peek();
      if (ch === '"' || ch === "'") {
        if (ch === "'") addWarning("작은따옴표(')를 큰따옴표로 보정했습니다.");
        return { value: unescapeJsonString(readQuotedString(ch)) };
      }
      var start = i;
      while (i < len) {
        var c = text.charAt(i);
        if (c === '"' || c === "'") {
          var captured = text.slice(start, i).trim();
          i++;
          addWarning(context === "key" ? "키에 누락된 여는 인용부호를 보정했습니다." : "값에 누락된 여는 인용부호를 보정했습니다.");
          return { value: captured };
        }
        if (c === ":" || c === "," || c === "}" || c === "]") break;
        i++;
      }
      var word = text.slice(start, i).trim();
      if (context === "key") {
        if (word !== "") addWarning("키에 누락된 인용부호를 보정했습니다.");
        return { value: word };
      }
      if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(word)) return { value: Number(word) };
      if (word === "true") return { value: true };
      if (word === "false") return { value: false };
      if (word === "null") return { value: null };
      if (word !== "") addWarning("값에 누락된 인용부호를 보정했습니다.");
      return { value: word };
    }

    function parseValue() {
      skipWs();
      var ch = peek();
      if (ch === "{") return parseObject();
      if (ch === "[") return parseArray();
      if (ch === "-" || (ch >= "0" && ch <= "9")) {
        var m = /^-?\d+(\.\d+)?([eE][+-]?\d+)?/.exec(text.slice(i));
        if (m) { i += m[0].length; return Number(m[0]); }
      }
      if (text.slice(i, i + 4) === "true") { i += 4; return true; }
      if (text.slice(i, i + 5) === "false") { i += 5; return false; }
      if (text.slice(i, i + 4) === "null") { i += 4; return null; }
      if (ch === "") { addWarning("값이 누락되어 빈 문자열로 처리했습니다."); return ""; }

      var strVal = readLenientToken("value").value;
      if (typeof strVal === "string") {
        skipWs();
        if (peek() === ":") {
          // this "value" was actually meant to be the first key of a nested
          // object whose opening "{" is missing entirely.
          addWarning("값 앞의 여는 중괄호({)가 없어 자동으로 보정했습니다.");
          i++; // consume ':'
          skipWs();
          var obj2 = {};
          obj2[strVal] = parseValue();
          skipWs();
          if (peek() === ",") { i++; }
          else if (peek() === "}") { i++; return obj2; }
          else if (peek() === "") { addWarning("닫는 중괄호(})가 없어 자동으로 닫았습니다."); return obj2; }
          else { addWarning("쉼표(,)가 누락되어 자동으로 보정했습니다."); }
          return parseObjectEntries(obj2);
        }
      }
      return strVal;
    }

    function parseObjectEntries(obj) {
      while (i < len) {
        skipWs();
        if (peek() === "}") { i++; break; }
        if (peek() === ",") { addWarning("불필요한 쉼표를 무시했습니다."); i++; continue; }
        if (peek() === "") { addWarning("닫는 중괄호(})가 없어 자동으로 닫았습니다."); break; }
        var key = String(readLenientToken("key").value);
        skipWs();
        if (peek() === ":") { i++; }
        else { addWarning("키와 값 사이의 콜론(:)이 누락되어 자동으로 보정했습니다."); }
        skipWs();
        obj[key] = parseValue();
        skipWs();
        if (peek() === ",") { i++; continue; }
        if (peek() === "}") { i++; break; }
        if (peek() === "") { addWarning("닫는 중괄호(})가 없어 자동으로 닫았습니다."); break; }
        addWarning("쉼표(,)가 누락되어 자동으로 보정했습니다.");
      }
      return obj;
    }

    function parseObject() {
      i++; // consume '{'
      var obj = {};
      skipWs();
      if (peek() === "}") { i++; return obj; }
      return parseObjectEntries(obj);
    }

    function parseArray() {
      i++; // consume '['
      var arr = [];
      skipWs();
      if (peek() === "]") { i++; return arr; }
      while (i < len) {
        skipWs();
        if (peek() === "]") { i++; break; }
        if (peek() === ",") { addWarning("불필요한 쉼표를 무시했습니다."); i++; continue; }
        if (peek() === "") { addWarning("닫는 대괄호(])가 없어 자동으로 닫았습니다."); break; }
        arr.push(parseValue());
        skipWs();
        if (peek() === ",") { i++; continue; }
        if (peek() === "]") { i++; break; }
        if (peek() === "") { addWarning("닫는 대괄호(])가 없어 자동으로 닫았습니다."); break; }
        addWarning("쉼표(,)가 누락되어 자동으로 보정했습니다.");
      }
      return arr;
    }

    skipWs();
    if (peek() !== "{" && peek() !== "[") {
      throw new Error("JSON 형식을 해석할 수 없습니다.");
    }
    var value = parseValue();
    return { value: value, warnings: warnings };
  }

  function parseInput(text, mode) {
    var fmt = mode === "auto" ? detectFormat(text) : mode;
    if (fmt === "json") {
      try {
        return { format: "json", model: JSON.parse(text), rootTag: "root", warnings: [] };
      } catch (e) {
        var repaired = lenientJsonParse(text);
        return { format: "json", model: repaired.value, rootTag: "root", warnings: repaired.warnings };
      }
    }
    if (fmt === "xml") {
      try {
        var r = parseXml(text);
        return { format: "xml", model: r.data, rootTag: r.rootTag, warnings: [] };
      } catch (e) {
        var repairedXml = lenientXmlParse(text);
        return { format: "xml", model: repairedXml.data, rootTag: repairedXml.rootTag, warnings: repairedXml.warnings };
      }
    }
    var qs = parseQueryString(text);
    return { format: "querystring", model: qs.obj, rootTag: "root", warnings: qs.warnings };
  }

  // ---------- conversion: model -> querystring ----------

  function flattenToPairs(value) {
    var out = [];
    function walk(key, val) {
      if (Array.isArray(val)) {
        val.forEach(function (v, i) { walk(key + "[" + i + "]", v); });
      } else if (val !== null && typeof val === "object") {
        var keys = Object.keys(val);
        if (keys.length === 0) { out.push([key, ""]); return; }
        keys.forEach(function (k) { walk(key ? key + "." + k : k, val[k]); });
      } else {
        out.push([key, val === null || val === undefined ? "" : String(val)]);
      }
    }
    if (Array.isArray(value)) {
      value.forEach(function (v, i) { walk("[" + i + "]", v); });
    } else if (value !== null && typeof value === "object") {
      Object.keys(value).forEach(function (k) { walk(k, value[k]); });
    } else {
      walk("value", value);
    }
    return out;
  }

  function modelToQueryString(model, pretty) {
    var pairs = flattenToPairs(model);
    if (pairs.length === 0) return "";
    if (!pretty) {
      return pairs.map(function (p) { return encodeURIComponent(p[0]) + "=" + encodeURIComponent(p[1]); }).join("&");
    }
    return pairs.map(function (p) { return "&" + encodeURIComponent(p[0]) + "=" + encodeURIComponent(p[1]); }).join("\n");
  }

  // ---------- conversion: model -> xml ----------

  function escapeXml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function sanitizeTag(tag) {
    var t = String(tag).replace(/[^a-zA-Z0-9_\-.]/g, "_");
    if (!t || /^[0-9]/.test(t)) t = "item_" + t;
    return t;
  }

  function buildXmlNode(tag, value, level, pretty) {
    tag = sanitizeTag(tag);
    var indent = pretty ? "  ".repeat(level) : "";
    var nl = pretty ? "\n" : "";

    if (Array.isArray(value)) {
      return value.map(function (v) { return buildXmlNode(tag, v, level, pretty); }).join(nl);
    }

    if (value !== null && typeof value === "object") {
      var attrs = {};
      var children = {};
      var textVal;
      Object.keys(value).forEach(function (k) {
        if (k === "#text") { textVal = value[k]; }
        else if (k.charAt(0) === "@") { attrs[k.slice(1)] = value[k]; }
        else { children[k] = value[k]; }
      });
      var attrStr = Object.keys(attrs).map(function (k) { return " " + sanitizeTag(k) + "=\"" + escapeXml(attrs[k]) + "\""; }).join("");
      var childKeys = Object.keys(children);

      if (childKeys.length === 0 && textVal === undefined) {
        return indent + "<" + tag + attrStr + "/>";
      }

      var innerParts = [];
      if (textVal !== undefined) innerParts.push(pretty ? "  ".repeat(level + 1) + escapeXml(textVal) : escapeXml(textVal));
      childKeys.forEach(function (k) { innerParts.push(buildXmlNode(k, children[k], level + 1, pretty)); });
      var inner = innerParts.join(nl);
      return indent + "<" + tag + attrStr + ">" + nl + inner + nl + indent + "</" + tag + ">";
    }

    var text = value === null || value === undefined ? "" : escapeXml(String(value));
    return indent + "<" + tag + ">" + text + "</" + tag + ">";
  }

  function modelToXml(model, rootTag, pretty) {
    var decl = '<?xml version="1.0" encoding="UTF-8"?>';
    var body = buildXmlNode(rootTag || "root", model, 0, pretty);
    return pretty ? decl + "\n" + body : decl + body;
  }

  // ---------- tree rendering ----------

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderTreeValue(key, value) {
    if (Array.isArray(value)) {
      if (value.length === 0) {
        return '<div class="tree-leaf"><span class="tree-key">' + escapeHtml(key) + '</span><span class="tree-colon">:</span><span class="tree-value tree-empty">[]</span></div>';
      }
      var children = value.map(function (v, i) { return renderTreeValue("[" + i + "]", v); }).join("");
      return '<details class="tree-node" open><summary><span class="tree-key">' + escapeHtml(key) +
        '</span><span class="tree-meta">Array(' + value.length + ")</span></summary>" +
        '<div class="tree-children">' + children + "</div></details>";
    }
    if (value !== null && typeof value === "object") {
      var keys = Object.keys(value);
      if (keys.length === 0) {
        return '<div class="tree-leaf"><span class="tree-key">' + escapeHtml(key) + '</span><span class="tree-colon">:</span><span class="tree-value tree-empty">{}</span></div>';
      }
      var childrenHtml = keys.map(function (k) { return renderTreeValue(k, value[k]); }).join("");
      return '<details class="tree-node" open><summary><span class="tree-key">' + escapeHtml(key) +
        '</span><span class="tree-meta">Object · ' + keys.length + "개 키</span></summary>" +
        '<div class="tree-children">' + childrenHtml + "</div></details>";
    }
    var cls = "tree-string";
    var display;
    if (value === null) { cls = "tree-null"; display = "null"; }
    else if (typeof value === "number") { cls = "tree-number"; display = String(value); }
    else if (typeof value === "boolean") { cls = "tree-bool"; display = String(value); }
    else { display = escapeHtml(String(value)); }
    return '<div class="tree-leaf"><span class="tree-key">' + escapeHtml(key) + '</span><span class="tree-colon">:</span><span class="tree-value ' + cls + '">' + display + "</span></div>";
  }

  function renderTree(model) {
    if (Array.isArray(model)) {
      if (model.length === 0) return '<div class="empty-hint">빈 배열입니다.</div>';
      return model.map(function (v, i) { return renderTreeValue("[" + i + "]", v); }).join("");
    }
    if (model !== null && typeof model === "object") {
      var keys = Object.keys(model);
      if (keys.length === 0) return '<div class="empty-hint">빈 객체입니다.</div>';
      return keys.map(function (k) { return renderTreeValue(k, model[k]); }).join("");
    }
    return renderTreeValue("value", model);
  }

  // ---------- UI wiring ----------

  function showFatalError(msg) {
    errorLine.classList.remove("warn");
    errorText.textContent = msg;
    errorLine.classList.add("show");
    detectedBadge.classList.add("err");
  }
  function showWarning(warnings) {
    errorLine.classList.add("warn");
    errorText.textContent = "입력값에 오류가 있어 자동으로 보정했습니다 — " + warnings.join(" · ");
    errorLine.classList.add("show");
    detectedBadge.classList.remove("err");
  }
  function hideMessage() {
    errorLine.classList.remove("show", "warn");
    detectedBadge.classList.remove("err");
  }

  function setPlaceholderState(hasContent) {
    if (hasContent) prettyOutput.classList.remove("placeholder"); else prettyOutput.classList.add("placeholder");
    if (!hasContent) treeOutput.innerHTML = "";
  }

  function updateOutputs() {
    outFormatBadge.textContent = FORMAT_LABEL[state.outputFormat];

    if (state.lastModel === null) {
      prettyOutput.textContent = "";
      setPlaceholderState(false);
      return;
    }

    var pretty;
    if (state.outputFormat === "json") {
      pretty = JSON.stringify(state.lastModel, null, 2);
    } else if (state.outputFormat === "xml") {
      pretty = modelToXml(state.lastModel, state.lastRootTag, true);
    } else {
      pretty = modelToQueryString(state.lastModel, true);
    }

    prettyOutput.textContent = pretty;
    treeOutput.innerHTML = renderTree(state.lastModel);
    setPlaceholderState(true);
  }

  function process() {
    var text = inputText.value;
    if (!text.trim()) {
      hideMessage();
      detectedBadge.textContent = "감지: -";
      state.lastModel = null;
      updateOutputs();
      return;
    }
    try {
      var result = parseInput(text, state.inputMode);
      detectedBadge.textContent = "감지: " + FORMAT_LABEL[result.format];
      state.lastModel = result.model;
      state.lastRootTag = result.rootTag;
      updateOutputs();
      if (result.warnings && result.warnings.length > 0) {
        showWarning(result.warnings);
      } else {
        hideMessage();
      }
    } catch (e) {
      showFatalError(e.message || String(e));
    }
  }

  var debounceTimer = null;
  inputText.addEventListener("input", function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(process, 150);
  });

  function wireSegmented(id, onChange) {
    var el = document.getElementById(id);
    el.addEventListener("click", function (e) {
      var btn = e.target.closest("button");
      if (!btn) return;
      Array.prototype.forEach.call(el.children, function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      onChange(btn.getAttribute("data-val"));
    });
  }

  wireSegmented("inputFormatSeg", function (val) { state.inputMode = val; process(); });
  wireSegmented("outputFormatSeg", function (val) { state.outputFormat = val; updateOutputs(); });

  document.querySelectorAll(".copy-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var text = prettyOutput.textContent || "";
      if (!text) return;
      navigator.clipboard.writeText(text).then(function () {
        var original = btn.textContent;
        btn.textContent = "복사됨";
        btn.classList.add("copied");
        setTimeout(function () { btn.textContent = original; btn.classList.remove("copied"); }, 1200);
      });
    });
  });

  var EXAMPLES = {
    qs: "name=John&age=30&city=Seoul&&tag=a&tag=b",
    json: '{"name":"John","age":30,"address":{"city":"Seoul","zip":"04524"},"tags":["a","b"]}',
    xml: "<root><name>John</name><age>30</age><address><city>Seoul</city><zip>04524</zip></address><tags><tag>a</tag><tag>b</tag></tags></root>"
  };

  document.querySelectorAll(".examples button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var ex = btn.getAttribute("data-ex");
      if (ex === "clear") { inputText.value = ""; }
      else {
        inputText.value = EXAMPLES[ex];
        document.querySelectorAll("#inputFormatSeg button").forEach(function (b) { b.classList.remove("active"); });
        document.querySelector('#inputFormatSeg button[data-val="auto"]').classList.add("active");
        state.inputMode = "auto";
      }
      process();
    });
  });

  // initial demo state
  inputText.value = EXAMPLES.qs;
  process();
})();
</script>
